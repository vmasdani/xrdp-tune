# Universal split-VPN configuration.
# Sourced by both the non-persistent and persistent scripts.
# Edit these values, not the scripts.

# Network interface created by OpenVPN (usually tun0).
VPN_DEV="tun0"

# Login name of the user whose traffic is forced through the VPN.
# Leave EMPTY to auto-detect the human running the command: the scripts use
# $SUDO_USER (the user behind sudo) and fall back to $USER. Set an explicit
# name here (for example "vpnuser") to route a dedicated account instead.
# The scripts refuse to route "root", since that would tunnel everything.
VPN_USER=""

# Firewall mark and routing table number used to steer that user's
# packets into the VPN. Change only if these numbers collide with
# something else on the box.
FW_MARK="0x2"
RT_TABLE="200"
